  <!-- Bottom Interoperability Banner -->
  <g transform="translate(45, 365)">
    <rect x="0" y="0" width="710" height="50" rx="8" fill="#082026" stroke="#155e75" stroke-width="1" />
    <circle cx="20" cy="25" r="5" fill="#10b981" />
    <text x="35" y="29" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Platform Protocol:</text>
    <text x="140" y="29" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Lightweight Cross-Department Interoperability Layer</text>
    <text x="445" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Tech: React + Vite + Node.js / Express REST API</text>
  </g>
</svg>
