<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="govBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04131a" />
      <stop offset="50%" stop-color="#082329" />
      <stop offset="100%" stop-color="#020d12" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2e32" />
      <stop offset="100%" stop-color="#0a1f22" />
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13352c" />
      <stop offset="100%" stop-color="#0d241e" />
    </linearGradient>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#govBgGrad)" />

  <!-- Subtle geometric line patterns -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <circle cx="400" cy="225" r="300" fill="none" />
    <circle cx="400" cy="225" r="200" fill="none" />
    <circle cx="400" cy="225" r="100" fill="none" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="400" y1="0" x2="400" y2="450" />
  </g>

  <!-- Window Chrome -->
  <rect x="25" y="20" width="750" height="410" rx="12" fill="#06181d" stroke="#164e63" stroke-width="1.5" />
  
  <!-- Window Titlebar -->
  <path d="M 25 32 Q 25 20 37 20 L 763 20 Q 775 20 775 32 L 775 58 L 25 58 Z" fill="#082026" />
  <circle cx="48" cy="39" r="6" fill="#ef4444" />
  <circle cx="68" cy="39" r="6" fill="#eab308" />
  <circle cx="88" cy="39" r="6" fill="#22c55e" />

  <!-- URL Bar -->
  <rect x="130" y="28" width="460" height="22" rx="6" fill="#0e2a32" />
  <text x="145" y="43" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://connectgovt.vercel.app</text>
  <rect x="620" y="28" width="135" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <text x="633" y="43" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">STUDENT INITIATIVE</text>

  <!-- Gov Portal Top Ribbon -->
  <g transform="translate(45, 72)">
    <rect x="0" y="0" width="710" height="42" rx="8" fill="#0a252c" stroke="#155e75" stroke-width="1" />
    
    <!-- Emblem placeholder & Brand -->
    <rect x="10" y="6" width="30" height="30" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="25" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🏛</text>
    <text x="50" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">ConnectGov</text>
    <text x="142" y="21" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11">| शासन आंतरकार्यक्षमता मंच (महाराष्ट्र)</text>
    <text x="50" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Centralized Public Services &amp; Interoperability Discovery Portal</text>

    <!-- Language selector -->
    <g transform="translate(530, 10)">
      <rect x="0" y="0" width="168" height="22" rx="4" fill="#082026" stroke="#155e75" stroke-width="0.8" />
      <text x="12" y="15" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">ENG</text>
      <text x="45" y="15" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">|</text>
      <text x="58" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">मराठी</text>
      <text x="100" y="15" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">|</text>
      <text x="115" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">हिन्दी</text>
      <rect x="145" y="3" width="18" height="16" rx="2" fill="#155e75" />
      <text x="149" y="14" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="8.5">A+</text>
    </g>
  </g>

  <!-- Search & Discovery Banner -->
  <g transform="translate(45, 126)">
    <rect x="0" y="0" width="710" height="42" rx="8" fill="#082329" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">🔍</text>
    <text x="45" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Search government education schemes, scholarships, welfare programs...</text>
    <rect x="590" y="7" width="110" height="28" rx="6" fill="#10b981" />
    <text x="615" y="25" fill="#04131a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Search Portal</text>
  </g>

  <!-- Three Service Cards Columns -->
  <g transform="translate(45, 180)">
    <!-- Column 1: Education & Scholarships -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="175" rx="10" fill="url(#cardBg1)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <rect x="15" y="15" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="32" y="37" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎓</text>
      <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Education &amp; Schemes</text>
      <text x="60" y="44" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="9.5">शिक्षण व शिष्यवृत्ती</text>

      <line x1="15" y1="58" x2="210" y2="58" stroke="#164e63" stroke-width="1" />

      <g transform="translate(15, 68)">
        <circle cx="5" cy="8" r="3" fill="#10b981" />
        <text x="16" y="11" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">MahaDBT Post-Matric Schemes</text>

        <circle cx="5" cy="30" r="3" fill="#10b981" />
        <text x="16" y="33" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Higher Education Assistance</text>

        <circle cx="5" cy="52" r="3" fill="#10b981" />
        <text x="16" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Technical &amp; Vocational Grants</text>

        <circle cx="5" cy="74" r="3" fill="#10b981" />
        <text x="16" y="77" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Minority Welfare Stipends</text>
      </g>

      <rect x="15" y="142" width="195" height="22" rx="4" fill="#04131a" stroke="#164e63" stroke-width="1" />
      <text x="112" y="157" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">View 18 Available Services →</text>
    </g>

    <!-- Column 2: Employment & Skills -->
    <g transform="translate(242, 0)">
      <rect x="0" y="0" width="225" height="175" rx="10" fill="url(#cardBg2)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.2" />
      <rect x="15" y="15" width="34" height="34" rx="8" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
      <text x="32" y="37" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">💼</text>
      <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Employment &amp; Skills</text>
      <text x="60" y="44" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9.5">रोजगार व कौशल्य विकास</text>

      <line x1="15" y1="58" x2="210" y2="58" stroke="#164e63" stroke-width="1" />

      <g transform="translate(15, 68)">
        <circle cx="5" cy="8" r="3" fill="#06b6d4" />
        <text x="16" y="11" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Mahaswayam Portal Access</text>

        <circle cx="5" cy="30" r="3" fill="#06b6d4" />
        <text x="16" y="33" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Youth Apprenticeship Register</text>

        <circle cx="5" cy="52" r="3" fill="#06b6d4" />
        <text x="16" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Self-Employment Seed Loans</text>

        <circle cx="5" cy="74" r="3" fill="#06b6d4" />
        <text x="16" y="77" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Rojgar Melawa Schedules</text>
      </g>

      <rect x="15" y="142" width="195" height="22" rx="4" fill="#04131a" stroke="#164e63" stroke-width="1" />
      <text x="112" y="157" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Explore Career Portals →</text>
    </g>

    <!-- Column 3: Citizen Consent & Interoperability -->
    <g transform="translate(485, 0)">
      <rect x="0" y="0" width="225" height="175" rx="10" fill="url(#cardBg3)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
      <rect x="15" y="15" width="34" height="34" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="32" y="37" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🛡</text>
      <text x="60" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Consent &amp; Tracking</text>
      <text x="60" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5">सहमती व अर्ज ट्रॅकिंग</text>

      <line x1="15" y1="58" x2="210" y2="58" stroke="#334155" stroke-width="1" />

      <g transform="translate(15, 68)">
        <rect x="0" y="0" width="195" height="26" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="0.8" />
        <text x="8" y="17" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Consent Token: Verified (DPDP)</text>

        <rect x="0" y="32" width="195" height="30" rx="4" fill="#0f172a" />
        <text x="8" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Application Lifecycle:</text>
        <text x="8" y="57" fill="#34d399" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">✓ Submitted → ⏳ Review → ○ Final</text>
      </g>

      <rect x="15" y="142" width="195" height="22" rx="4" fill="#04131a" stroke="#334155" stroke-width="1" />
      <text x="112" y="157" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Track Citizen Application →</text>
    </g>
