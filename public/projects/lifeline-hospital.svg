      <text x="0" y="215" fill="#e2e8f0" font-family="monospace" font-size="11">&gt; Patient Registered: ID #LH-9024 | Dr. Assigned: Dr. K. Mehta (Cardiology)</text>
      <text x="0" y="235" fill="#38bdf8" font-family="monospace" font-size="11">&gt; Room Allocated: ICU-04 | Status: Active Admitted</text>
