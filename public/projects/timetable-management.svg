<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f071a" />
      <stop offset="100%" stop-color="#08030d" />
    </linearGradient>
    
    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140a21" />
      <stop offset="100%" stop-color="#11071c" />
    </linearGradient>

    <!-- Inner Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0c2b" />
      <stop offset="100%" stop-color="#130821" />
    </linearGradient>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #b377ff; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-weight: 600; fill: #ffffff; }
      .text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #e0e0e0; }
      .text-highlight { fill: #a46cf0; font-weight: 600; }
    </style>
  </defs>

  <!-- Main Background -->
  <rect width="1024" height="600" fill="url(#bgGrad)" />

  <!-- Outer Card -->
  <rect x="32" y="32" width="960" height="536" rx="16" fill="url(#cardGrad)" stroke="#2a1640" stroke-width="2" />

  <!-- Top Bar Controls -->
  <!-- Mac Window Dots -->
  <circle cx="65" cy="55" r="7" fill="#ff5f56" />
  <circle cx="90" cy="55" r="7" fill="#ffbd2e" />
  <circle cx="115" cy="55" r="7" fill="#27c93f" />

  <!-- URL Bar -->
  <rect x="150" y="42" width="590" height="26" rx="13" fill="#1e1133" stroke="#2d1a4a" stroke-width="1" />
  <text x="180" y="59" fill="#806b99" font-family="sans-serif" font-size="12">https://timetable-generator-p1za.onrender.com</text>

  <!-- Live Badge -->
  <rect x="790" y="42" width="170" height="26" rx="13" fill="#1e1133" stroke="#5a2e99" stroke-width="1.5" />
  <text x="875" y="59" fill="#d694ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DBMS &amp; FLASK LIVE</text>

  <!-- Header Section -->
  <!-- Calendar Icon -->
  <g transform="translate(60, 95)">
    <rect width="45" height="45" rx="8" fill="#1e1133" stroke="#7942c7" stroke-width="2" />
    <rect x="8" y="10" width="29" height="5" rx="2" fill="#ff5f56" />
    <rect x="8" y="17" width="29" height="20" rx="2" fill="#e0e0e0" />
    <text x="22.5" y="31" fill="#140a21" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">17</text>
  </g>

  <!-- Title and Subtitle -->
  <text x="120" y="115" class="title" font-size="22">Time Table Management System</text>
  <text x="120" y="137" class="subtitle" font-size="13">Automated Institution Timetable Generator &amp; Relational Database</text>

  <!-- Left Content Box (Main Pipeline) -->
  <rect x="60" y="170" width="580" height="280" rx="12" fill="url(#panelGrad)" stroke="#331952" stroke-width="1" />
  
  <text x="100" y="215" class="mono" font-size="13">SQL Schema: [faculty] ⟷ [subjects] ⟷ [classrooms] ⟷ [slots]</text>
  <text x="100" y="235" class="title text-highlight" font-size="13">Rule-Based Generation Pipeline:</text>
  
  <text x="120" y="270" class="text-regular" font-size="13">✓ Automated faculty conflict elimination</text>
  <text x="120" y="300" class="text-regular" font-size="13">✓ Workload balancing &amp; normalized schema</text>
  <text x="120" y="330" class="text-regular" font-size="13">✓ CRUD operations on courses and room allocations</text>
  <text x="120" y="360" class="text-regular" font-size="13">✓ Relational MySQL &amp; SQLite database persistence</text>

  <!-- Right Content Box (Database Features) -->
  <rect x="670" y="170" width="290" height="280" rx="12" fill="url(#panelGrad)" stroke="#331952" stroke-width="1" />
  
  <text x="690" y="205" class="title" font-size="15">Database Features</text>
  
  <!-- Cleaned Feature Cards -->
  <!-- Card 1 -->
  <rect x="690" y="230" width="250" height="40" rx="6" fill="#24133b" stroke="#3d2163" stroke-width="0.5" />
  <text x="705" y="255" class="subtitle" font-size="12">Export Schedule to PDF / Excel</text>

  <!-- Card 2 -->
  <rect x="690" y="285" width="250" height="40" rx="6" fill="#24133b" stroke="#3d2163" stroke-width="0.5" />
  <text x="705" y="310" class="subtitle" font-size="12">Relational Table Normalization</text>

  <!-- Card 3 -->
  <rect x="690" y="340" width="250" height="40" rx="6" fill="#24133b" stroke="#3d2163" stroke-width="0.5" />
  <text x="705" y="365" class="subtitle" font-size="12">Interactive Web Interface</text>

  <!-- Card 4 -->
  <rect x="690" y="395" width="250" height="40" rx="6" fill="#24133b" stroke="#3d2163" stroke-width="0.5" />
  <text x="705" y="420" class="subtitle" font-size="12">Conflict-Free Slot Validation</text>

  <!-- Bottom Content Box (Tech Stack) -->
  <rect x="60" y="475" width="900" height="60" rx="12" fill="url(#panelGrad)" stroke="#331952" stroke-width="1" />
  
  <circle cx="85" cy="505" r="5" fill="#d694ff" />
  <text x="105" y="510" class="title" font-size="14">Technology Stack:</text>
  <text x="245" y="510" class="subtitle" font-size="14">Python Flask • MySQL • SQLite • HTML/CSS • JavaScript • DBMS Concepts</text>
</svg>